/* ---------- renderers ---------- */
const R={};
const head=cfg=>(cfg.title?`<h3>${esc(cfg.title)}</h3>`:'')+(cfg.intro?`<p class="intro">${esc(cfg.intro)}</p>`:'');

/* classify: choose one category per item */
R.classify=(el,cfg,st,save)=>{
 st.sel=st.sel||{};
 const draw=()=>{el.innerHTML=head(cfg)+cfg.items.map((it,i)=>`<div class="item" data-i="${i}"><p class="it">${esc(it.t)}</p>${it.bars?barsHTML(it.bars):''}<div class="opts">${cfg.cats.map((c,ci)=>`<button class="opt" data-ci="${ci}" aria-pressed="${st.sel[i]===c}">${esc(c)}</button>`).join('')}</div><p class="fbk" hidden></p></div>`).join('')+`<div class="row"><button class="btn primary" data-a="chk">Check answers</button><button class="btn" data-a="rst">Start again</button><span class="score" aria-live="polite"></span></div>`};
 draw();
 el.onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.ci!==undefined){const it=b.closest('.item');const i=it.dataset.i;st.sel[i]=cfg.cats[b.dataset.ci];save();
   $$('.opt',it).forEach(x=>x.setAttribute('aria-pressed',x===b));const f=$('.fbk',it);f.hidden=true;$('.score',el).textContent='';}
  else if(b.dataset.a==='rst'){st.sel={};save();draw();}
  else if(b.dataset.a==='chk'){let ok=0;cfg.items.forEach((it,i)=>{const f=$(`.item[data-i="${i}"] .fbk`,el);f.hidden=false;const s=st.sel[i];
    if(!s){f.className='fbk info';f.textContent='Choose an answer first.';return}
    if(it.ok.includes(s)){ok++;f.className='fbk good';f.textContent='✓ '+(it.ok.length>1?`Good. Accepted: ${it.ok.join(' or ')}. `:'')+it.why}
    else{f.className='fbk bad';f.textContent=`✗ Not quite. Best fit: ${it.ok.join(' or ')}. ${it.why}`}});
   $('.score',el).textContent=`${ok} of ${cfg.items.length} correct`;}
 };
};

/* builder: choose one option per section, assemble a plan card */
R.builder=(el,cfg,st,save)=>{
 st.sel=st.sel||{};
 const draw=()=>{
  el.innerHTML=head(cfg)+cfg.sections.map((s,si)=>`<div class="sec" data-si="${si}"><h4>${esc(s.label)}</h4><div class="opts col">${s.opts.map((o,oi)=>`<button class="opt" data-oi="${oi}" aria-pressed="${st.sel[s.k]===oi}">${esc(o.t)}</button>`).join('')}</div><p class="fbk" hidden></p></div>`).join('')+
  `<div class="plan" aria-live="polite"><h4>${esc(cfg.cardTitle||'Your plan')}</h4><div class="pc"></div></div>
  <div class="row"><button class="btn primary" data-a="chk">Check my choices</button>${cfg.tests?'<button class="btn" data-a="test">Run stress tests</button>':''}<button class="btn" data-a="rst">Start again</button></div>
  <div class="tests"></div>`;card();};
 const card=()=>{$('.pc',el).innerHTML=cfg.sections.map(s=>`<p><b>${esc(s.label)}:</b> ${st.sel[s.k]!==undefined?esc(s.opts[st.sel[s.k]].t):'<span style="color:var(--mute)">not chosen yet</span>'}</p>`).join('')};
 draw();
 el.onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.oi!==undefined){const sec=b.closest('.sec');const s=cfg.sections[sec.dataset.si];st.sel[s.k]=+b.dataset.oi;save();
   $$('.opt',sec).forEach(x=>x.setAttribute('aria-pressed',x===b));$('.fbk',sec).hidden=true;$('.tests',el).innerHTML='';card();}
  else if(b.dataset.a==='rst'){st.sel={};save();draw();}
  else if(b.dataset.a==='chk'){cfg.sections.forEach((s,si)=>{const f=$(`.sec[data-si="${si}"] .fbk`,el);f.hidden=false;const v=st.sel[s.k];
    if(v===undefined){f.className='fbk info';f.textContent='Choose an option for this part.';return}
    const o=s.opts[v];f.className='fbk '+(o.q==='good'?'good':'warn');f.textContent=(o.q==='good'?'✓ Strong choice. ':'⚠ Rethink this. ')+o.fb;});}
  else if(b.dataset.a==='test'){const box=$('.tests',el);
   if(cfg.sections.some(s=>st.sel[s.k]===undefined)){box.innerHTML='<p class="fbk info">Choose an option for every part first.</p>';return}
   box.innerHTML=cfg.tests.map(t=>{const p=t.pass(st.sel);return `<p class="fbk ${p?'good':'warn'}"><b>${esc(t.n)}:</b> ${esc(p?t.ok:t.fail)}</p>`}).join('');}
 };
};

/* channel builder */
R.channel=(el,cfg,st,save)=>{
 st.ch=st.ch||{};st.r=st.r||0;
 const lvl=n=>n===0?'Direct channel (zero-level)':n===1?'One-level channel':`${['','','Two','Three','Four'][n]||n}-level channel`;
 const draw=(msg)=>{const r=cfg.routes[st.r];const ch=st.ch[st.r]||[];const ok=JSON.stringify(ch)===JSON.stringify(r.expect);const showP=msg&&ok&&r.showPrice;
  el.innerHTML=head(cfg)+`<div class="rtabs">${cfg.routes.map((x,i)=>`<button class="opt" data-r="${i}" aria-pressed="${i===st.r}">${esc(x.name)}</button>`).join('')}</div>
  <p class="intro" style="margin-bottom:8px"><b>Customer:</b> ${esc(r.who)}</p>
  <div class="chain"><span class="node end">STO${showP?`<small>MVR ${cfg.prices.STO}</small>`:''}</span>${ch.map((x,i)=>`<span class="arrow">→</span><button class="node mid" data-rm="${i}" title="Remove">${esc(x)}${showP?`<small>MVR ${cfg.prices[x]}</small>`:''}</button>`).join('')}<span class="arrow">→</span><span class="node end">Customer${showP?`<small>pays MVR ${cfg.prices[ch[ch.length-1]]||cfg.prices.STO}</small>`:''}</span></div>
  <div class="lvl" aria-live="polite">${lvl(ch.length)} · ${ch.length} intermediar${ch.length===1?'y':'ies'}</div>
  <p class="intro" style="margin:14px 0 6px">Add a business to the chain:</p>
  <div class="opts">${cfg.palette.map((p,i)=>`<button class="opt" data-add="${i}">+ ${esc(p)}</button>`).join('')}</div>
  <div class="row"><button class="btn primary" data-a="chk">Check this route</button><button class="btn" data-a="clr">Clear route</button><span class="score">${cfg.routes.filter((x,i)=>JSON.stringify(st.ch[i]||[])===JSON.stringify(x.expect)&&st['ok'+i]).length} of ${cfg.routes.length} routes checked</span></div>
  ${msg?`<p class="fbk ${ok?'good':'bad'}">${ok?'✓ '+esc(r.note):'✗ Not quite. Re-read the case and Exhibit 2. Which businesses does the product pass through on this route, and in what order?'}</p>`:''}`;};
 draw();
 el.onclick=e=>{const b=e.target.closest('button');if(!b)return;const ch=st.ch[st.r]=st.ch[st.r]||[];
  if(b.dataset.r!==undefined){st.r=+b.dataset.r;save();draw();}
  else if(b.dataset.add!==undefined){const p=cfg.palette[b.dataset.add];if(!ch.includes(p))ch.push(p);st['ok'+st.r]=false;save();draw();}
  else if(b.dataset.rm!==undefined){ch.splice(+b.dataset.rm,1);st['ok'+st.r]=false;save();draw();}
  else if(b.dataset.a==='clr'){st.ch[st.r]=[];st['ok'+st.r]=false;save();draw();}
  else if(b.dataset.a==='chk'){const r=cfg.routes[st.r];st['ok'+st.r]=JSON.stringify(ch)===JSON.stringify(r.expect);save();draw(true);}
 };
};

/* atmosphere designer */
R.atmos=(el,cfg,st,save)=>{
 st.sel=st.sel||cfg.controls.map(()=>0);
 const max=cfg.controls.reduce((a,c)=>a+Math.max(...c.opts.map(o=>o.s)),0);
 const draw=()=>{const sc=cfg.controls.reduce((a,c,i)=>a+c.opts[st.sel[i]].s,0);const pct=Math.round(sc/max*100);
  const label=pct<=30?'Practical and everyday':pct<70?'Mixed signals':'Premium and curated';
  const left=cfg.controls.filter((c,i)=>st.sel[i]===0).map(c=>c.k.toLowerCase());
  const senses=[...new Set(cfg.controls.filter((c,i)=>c.opts[st.sel[i]].s>0).map(c=>c.sense))];
  el.innerHTML=head(cfg)+cfg.controls.map((c,i)=>`<div class="ctrl"><div class="lab">${esc(c.k)}<small>${esc(c.sense)}</small></div><div class="opts">${c.opts.map((o,oi)=>`<button class="opt" data-c="${i}" data-o="${oi}" aria-pressed="${st.sel[i]===oi}">${esc(o.t)}</button>`).join('')}</div></div>`).join('')+
  `<div style="margin-top:16px"><b>What your corner says: ${label}</b>
   <div class="meter" role="img" aria-label="${label}, ${pct} percent premium"><i style="left:${Math.max(2,Math.min(98,pct))}%"></i></div>
   <div class="mlab"><span>Practical and everyday</span><span>Premium and curated</span></div></div>
  <p class="fbk ${pct>=70?'good':pct>30?'warn':'info'}">${pct===100?'Every cue signals premium. Now think about what should stay the same so it still feels like STO: bilingual signs, easy movement, friendly service.':pct>=70?`Strong premium feel. These cues still say “everyday”: ${left.join(', ')}. Is that on purpose?`:pct>30?`Mixed signals. Shoppers may be unsure what this corner is for. Still everyday: ${left.join(', ')}.`:'This looks like the rest of People’s Choice. Change some cues to make the corner feel premium.'}${senses.length?` Senses you are using: ${senses.join(', ')}.`:''}</p>
  <div class="tbl" style="margin-top:12px"><table><tr><th>Cue</th><th>Main store</th><th>Your STO Select corner</th></tr>${cfg.controls.map((c,i)=>`<tr><td>${esc(c.k)}</td><td>${esc(c.opts[0].t)}</td><td>${esc(c.opts[st.sel[i]].t)}</td></tr>`).join('')}</table></div>
  <div class="row"><button class="btn" data-a="rst">Start again</button></div>`;};
 draw();
 el.onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.c!==undefined){st.sel[+b.dataset.c]=+b.dataset.o;save();draw();}
  else if(b.dataset.a==='rst'){st.sel=cfg.controls.map(()=>0);save();draw();}};
};

/* distribution intensity */
R.intensity=(el,cfg,st,save)=>{
 st.sel=st.sel||{};const L=Object.keys(cfg.levels);const tag={strong:['good','✓ Strong choice. '],possible:['warn','~ Possible. '],weak:['bad','✗ Weak choice. ']};
 const draw=()=>{el.innerHTML=head(cfg)+cfg.items.map((it,i)=>{const s=st.sel[i];const f=s&&it.fb[s];
  return `<div class="item" data-i="${i}"><p class="it" style="font-weight:700">${esc(it.t)}</p><p class="intro" style="margin:0 0 8px">${esc(it.d)}</p>
  <div class="opts">${L.map(l=>`<button class="opt" data-l="${l}" aria-pressed="${s===l}">${l}</button>`).join('')}</div>
  ${s?barsHTML(cfg.levels[s])+`<p class="fbk ${tag[f[0]][0]}">${tag[f[0]][1]}${esc(f[1])}</p>`:''}</div>`}).join('')+
  `<div class="row"><button class="btn" data-a="rst">Start again</button></div>`;};
 draw();
 el.onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.l){st.sel[b.closest('.item').dataset.i]=b.dataset.l;save();draw();}
  else if(b.dataset.a==='rst'){st.sel={};save();draw();}};
};

/* order the selling process */
R.order=(el,cfg,st,save)=>{
 st.o=st.o||cfg.start.slice();st.cmp=!!st.cmp;
 const draw=(chk)=>{const allOk=st.o.every((x,i)=>x===i);
  el.innerHTML=head(cfg)+st.o.map((si,pos)=>{const s=cfg.steps[si];const ok=chk&&si===pos;
   return `<div class="orow ${chk?(ok?'ok':'no'):''}"><span class="pos">${pos+1}</span><div>${ok||st.cmp&&chk&&allOk?`<span class="sn">${esc(s.n)}</span>`:''}${esc(s.m)}${st.cmp?`<span class="tr">Transactional seller: ${esc(s.tr)}</span>`:''}</div>
   <div class="mv"><button data-up="${pos}" aria-label="Move up" ${pos===0?'disabled':''}>↑</button><button data-dn="${pos}" aria-label="Move down" ${pos===st.o.length-1?'disabled':''}>↓</button></div></div>`}).join('')+
  `<div class="row"><button class="btn primary" data-a="chk">Check order</button><button class="btn" data-a="cmp" aria-pressed="${st.cmp}">${st.cmp?'Hide':'Show'} transactional seller</button><button class="btn" data-a="rst">Shuffle again</button>
  ${chk?`<span class="score">${st.o.filter((x,i)=>x===i).length} of ${st.o.length} in the right place</span>`:''}</div>
  ${chk&&allOk?'<p class="fbk good">✓ All seven steps in order. Each step now shows its name. Which two steps do the most to build a long-term relationship?</p>':''}`;};
 draw();
 el.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  const sw=(a,c)=>{[st.o[a],st.o[c]]=[st.o[c],st.o[a]];save();draw();};
  if(b.dataset.up!==undefined){const p=+b.dataset.up;sw(p,p-1);}
  else if(b.dataset.dn!==undefined){const p=+b.dataset.dn;sw(p,p+1);}
  else if(b.dataset.a==='chk')draw(true);
  else if(b.dataset.a==='cmp'){st.cmp=!st.cmp;save();draw();}
  else if(b.dataset.a==='rst'){st.o=cfg.start.slice();save();draw();}};
};

/* 2x2 grid placement */
R.grid=(el,cfg,st,save)=>{
 st.p=st.p||{};let pick=null;
 const draw=(chk)=>{const tray=cfg.items.map((it,i)=>i).filter(i=>!st.p[i]);
  const chip=i=>{const it=cfg.items[i];const cls=chk&&st.p[i]?(st.p[i]===it.q?'ok':'no'):'';return `<button class="pchip ${cls}" data-it="${i}" aria-pressed="${pick===i}">${esc(it.t)}</button>`};
  el.innerHTML=head(cfg)+`<div class="tray" aria-label="Products to place">${tray.length?tray.map(chip).join(''):'<span class="intro" style="margin:0">All products placed.</span>'}</div>
  <div class="gwrap"><div class="yax">Long-run benefit: low → high</div><div class="board">${cfg.quads.map(q=>`<div class="quad" data-q="${esc(q.n)}" role="button" tabindex="0"><b>${esc(q.n)}</b><small>${esc(q.d)}</small>${cfg.items.map((it,i)=>st.p[i]===q.n?chip(i):'').join('')}</div>`).join('')}</div><div class="xax">Satisfaction right now: low → high</div></div>
  <div class="row"><button class="btn primary" data-a="chk">Check grid</button><button class="btn" data-a="rst">Start again</button>${chk?`<span class="score">${cfg.items.filter((it,i)=>st.p[i]===it.q).length} of ${cfg.items.length} correct</span>`:''}</div>
  ${chk?`<div>${cfg.items.filter((it,i)=>st.p[i]&&st.p[i]!==it.q).map(it=>`<p class="fbk bad">✗ “${esc(it.t)}” belongs in <b>${esc(it.q)}</b>.</p>`).join('')}</div>`:''}`;};
 draw();
 const place=q=>{if(pick===null)return;st.p[pick]=q;pick=null;save();draw();};
 el.onclick=e=>{const ch=e.target.closest('.pchip');
  if(ch){const i=+ch.dataset.it;if(st.p[i]&&pick===null){delete st.p[i];save();draw();return}pick=pick===i?null:i;draw();return}
  const q=e.target.closest('.quad');if(q){place(q.dataset.q);return}
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.a==='chk')draw(true);else if(b.dataset.a==='rst'){st.p={};pick=null;save();draw();}};
 el.onkeydown=e=>{const q=e.target.closest('.quad');if(q&&(e.key==='Enter'||e.key===' ')){e.preventDefault();place(q.dataset.q)}};
};

/* claim checker */
R.claims=(el,cfg,st,save)=>{
 st.t=st.t||{};st.show=!!st.show;
 const lab=n=>n>=3?'Credible':n===2?'Weak':'Greenwashing risk';
 const draw=()=>{el.innerHTML=head(cfg)+cfg.claims.map((c,i)=>{const t=st.t[i]||[0,0,0,0];const n=t.filter(Boolean).length;
  return `<div class="claim" data-i="${i}"><div class="who">${esc(c.who)}</div><p class="ct">“${esc(c.t)}”</p>
  <div class="crit">${cfg.crit.map((k,ki)=>`<button class="opt" data-k="${ki}" aria-pressed="${!!t[ki]}">${esc(k)}</button>`).join('')}</div>
  <div class="gauge"><span class="seg">${[0,1,2,3].map(x=>`<i class="${x<n?'on':''}"></i>`).join('')}</span><span>${lab(n)}</span></div>
  ${st.show?`<p class="sugg">Suggested: ${cfg.crit.filter((k,ki)=>c.s[ki]).map(k=>k.split(':')[0]).join(', ')||'none of the tests'} → <b>${lab(c.s.filter(Boolean).length)}</b>. ${esc(c.why)}</p>`:''}</div>`}).join('')+
  `<div class="row"><button class="btn primary" data-a="show">${st.show?'Hide':'Show'} suggested ticks</button><button class="btn" data-a="rst">Start again</button></div>`;};
 draw();
 el.onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.k!==undefined){const i=b.closest('.claim').dataset.i;const t=st.t[i]=st.t[i]||[0,0,0,0];t[+b.dataset.k]=t[+b.dataset.k]?0:1;save();draw();}
  else if(b.dataset.a==='show'){st.show=!st.show;save();draw();}
  else if(b.dataset.a==='rst'){st.t={};st.show=false;save();draw();}};
};

/* ---------- student sign-in ----------
   The class list lives in a Google Sheet. Only the ID is sent to the Apps Script,
   which answers yes or no. See tools/README.md for setup. */
const SKEY=TERM.signin.key;
function me(){try{const r=JSON.parse(localStorage.getItem(SKEY)||sessionStorage.getItem(SKEY)||'null');return r&&/^S0\d{5}$/.test(r.sid||'')?r:null}catch(e){return null}}
function signOut(){try{localStorage.removeItem(SKEY);sessionStorage.removeItem(SKEY)}catch(e){}location.hash='#/';route()}
function saveMe(rec){
 try{
  // a different student on this device: clear the previous student's progress (keep the theme).
  // The last ID is kept separately because signing out removes the record.
  const last=localStorage.getItem('mkt101-last');
  if(last!==rec.sid)Object.keys(localStorage).filter(k=>k.startsWith('mkt101_')&&k!=='mkt101_theme').forEach(k=>localStorage.removeItem(k));
  localStorage.setItem('mkt101-last',rec.sid);
  localStorage.setItem(SKEY,JSON.stringify(rec));sessionStorage.setItem(SKEY,JSON.stringify(rec));
 }catch(e){}
}
const logoHTML=(sm)=>`<span class="mnu ${sm?'sm':''}"><img src="assets/mnu-logo.png" alt="The Maldives National University logo" width="560" height="676"></span>`;

document.addEventListener('click',e=>{if(e.target.closest('[data-signout]'))signOut()});

   <div><small>Your student email</small><b id="gMailTxt"></b></div></div>
  <p class="gerr" id="gErr" role="alert"></p>
  <button class="btn primary" id="gGo" type="submit" disabled>Verify and start</button>
 </form>
 <p class="small">Your progress stays on this device. <a href="#/">Back</a></p></div>`;
 const name=$('#gName'),id=$('#gId'),mail=$('#gMail'),mt=$('#gMailTxt'),err=$('#gErr'),go=$('#gGo');
 const check=()=>{const d=id.value.replace(/\D/g,'').slice(0,6);if(id.value!==d)id.value=d;
  mt.innerHTML='s'+d+(d.length<6?'<i>'+'0xxxxx'.slice(d.length)+'</i>':'')+'@student.mnu.edu.mv';
  const idOk=/^0\d{5}$/.test(d),nameOk=name.value.trim().replace(/[^A-Za-z]/g,'').length>=3;
  mail.classList.toggle('ok',idOk);
  err.textContent=d.length&&d[0]!=='0'?'MNU student IDs start with S0. Check the first number.':'';
  go.disabled=!(idOk&&nameOk);return idOk&&nameOk;};
 name.oninput=id.oninput=check;check();name.focus();
 const enter=(rec)=>{saveMe(rec);let next='#/';try{next=sessionStorage.getItem('mkt101-next')||'#/';sessionStorage.removeItem('mkt101-next')}catch(e){}location.hash=next;};
 $('#gate').onsubmit=ev=>{ev.preventDefault();if(!check())return;
  const sid='S'+id.value,rec={name:name.value.trim().replace(/\s+/g,' '),sid,email:sid.toLowerCase()+'@student.mnu.edu.mv',verified:false,at:Date.now()};
  const notListed=()=>{go.textContent='Verify and start';check();err.textContent=`This ID is not on the ${TERM.code} class list for ${TERM.term}. Check the number, or ask your lecturer to add you.`};
  // class list check: roster.js holds scrambled IDs only (built by tools/build-roster.py)
  if(typeof ROSTER!=='undefined'&&ROSTER.hashes&&ROSTER.hashes.length&&window.crypto&&crypto.subtle){
   go.disabled=true;go.textContent='Checking the class list…';
   crypto.subtle.digest('SHA-256',new TextEncoder().encode(ROSTER.salt+'|'+sid)).then(b=>{
    const h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
    if(ROSTER.hashes.includes(h)){rec.verified=true;enter(rec)}else notListed();
   }).catch(()=>enter(rec));
   return;
  }
  const url=TERM.signin.checkUrl;
  if(!url){enter(rec);return}   // setup mode: no class list yet
  go.disabled=true;go.textContent='Checking the class list…';err.textContent='';
  fetch(url+'?action=check&sid='+encodeURIComponent(sid),{credentials:'omit',redirect:'follow',cache:'no-store'})
   .then(r=>r.json())
   .then(res=>{
    if(!res.ok&&res.reason==='error'){enter(rec);return}   // script problem: treat like an outage
    if(!res.ok){if(res.reason==='not-listed')notListed();else{go.textContent='Verify and start';check();err.textContent='Please check your student ID.'}return}
    rec.verified=!res.open;if(res.name&&res.name!=='Lecturer access')rec.name=res.name;if(res.email)rec.email=res.email;enter(rec);})
   .catch(()=>{enter(rec)});   // Google unreachable: let the student practise, marked unverified
 };
}

/* Diagrams for the notes. Built from HTML so text wraps on phones and follows the theme.
   flow: steps in order. grid: a 2 by 2 matrix. pyramid: levels, top first. rings: nested boxes, outside first. compare: side-by-side columns. */
function diagramHTML(d){
 const cap=d.title?`<figcaption>${esc(d.title)}</figcaption>`:'';const sub=x=>x?`<small>${esc(x)}</small>`:'';
 let body='';
 if(d.type==='flow')body=`<ol class="dflow">${d.steps.map(([h,s],i)=>`<li><span class="dn">${i+1}</span><b>${esc(h)}</b>${sub(s)}</li>`).join('')}</ol>${d.loop?`<p class="dloop">↻ ${esc(d.loop)}</p>`:''}`;
 else if(d.type==='grid')body=`<div class="dgrid"><span class="dyl">${esc(d.yl)}</span><div class="dbox"><span class="dyv">${esc(d.y[0])}</span><span class="dyv">${esc(d.y[1])}</span>
   ${d.cells.map(([h,s],i)=>`<div class="dcell c${i}"><b>${esc(h)}</b>${sub(s)}</div>`).join('')}<span></span><span class="dxv">${esc(d.x[0])}</span><span class="dxv">${esc(d.x[1])}</span></div><span class="dxl">${esc(d.xl)}</span></div>`;
 else if(d.type==='pyramid')body=`<div class="dpyr">${d.levels.map(([h,s],i)=>`<div style="width:${Math.round(40+60*i/Math.max(1,d.levels.length-1))}%"><b>${esc(h)}</b>${sub(s)}</div>`).join('')}</div>${d.note?`<p class="dloop">${esc(d.note)}</p>`:''}`;
 else if(d.type==='rings'){const r=(k)=>k>=d.rings.length?'':`<div class="dring r${k}"><b>${esc(d.rings[k][0])}</b>${sub(d.rings[k][1])}${r(k+1)}</div>`;body=r(0);}
 else if(d.type==='compare')body=`<div class="dcmp">${d.cols.map(([h,items])=>`<div><b>${esc(h)}</b><ul>${items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
 return `<figure class="dia">${cap}${body}</figure>`;
}
const listHTML=l=>`<ul>${l.map(x=>`<li>${Array.isArray(x)?`<b>${esc(x[0])}:</b> ${esc(x[1])}`:esc(x)}</li>`).join('')}</ul>`;
function ideaHTML(c,k){const ps=[].concat(c.p||[]);
 return `<section class="part concept" id="n-i${k}"><h3>${esc(c.h)}</h3>${ps.map(x=>`<p>${esc(x)}</p>`).join('')}${c.l?listHTML(c.l):''}${c.dia?diagramHTML(c.dia):''}${c.more?[].concat(c.more).map(x=>`<p>${esc(x)}</p>`).join(''):''}
  ${c.eg?`<p class="eg"><b>Maldives example:</b> ${esc(c.eg)}</p>`:''}${c.tip?`<p class="tip"><b>Exam tip:</b> ${esc(c.tip)}</p>`:''}</section>`}

/* ---------- study notes (data in notes.js) ---------- */
const GEMINI='https://gemini.google.com/app';
function renderNotes(P,el,sub,sub2){
 const N=notesOf(P.id),t=parseInt(sub,10),T=N.topics[t];const base=`#/paper/${P.id}/notes`;
 if(!T){document.title=P.name+' study notes · MKT101 Practice';
  el.innerHTML=`<p class="lead" style="margin-bottom:18px">${esc(N.intro)}</p>
  <h3 class="h2s" style="margin-top:0">How to use these notes</h3>
  <div class="steps" style="margin-bottom:22px">${N.how.map(([h,s],i)=>`<div class="step"><b>${i+1}. ${esc(h)}</b><span>${esc(s)}</span></div>`).join('')}</div>
  <h3 class="h2s">Topics</h3>
  <div class="ntopics">${P.topics.filter(x=>N.topics[x]).map(x=>`<a class="ntopic" href="${base}/${x}"><span class="kick">Topic ${x}</span><b>${esc(TERM.topics[x])}</b><span>${esc(N.topics[x].sum)}</span></a>`).join('')}</div>
  ${N.answer?`<div class="part" style="margin-top:22px"><h3>${esc(N.answer.h)}</h3><p class="intro">${esc(N.answer.p)}</p>${diagramHTML(N.answer.dia)}${listHTML(N.answer.l)}</div>`:''}
  ${paperFoot(P,'notes')}${footHTML()}`;return;}
 if(sub2==='practice'){renderDrill(P,t,el);return}
 document.title='Topic '+t+' notes · MKT101 Practice';
 const tps=P.topics.filter(x=>N.topics[x]),i=tps.indexOf(t),prev=tps[i-1],next=tps[i+1];const W=T.worked;
 const jumps=[['n-min','In one minute'],['n-ideas','Key ideas'],['n-terms','Key terms'],T.mistakes&&['n-mis','Common mistakes'],W&&['n-ans','Answer like this'],['n-chk','Check yourself'],['n-prac','Practise'],['n-ai','Explore with AI']].filter(Boolean);
 el.innerHTML=`<nav class="anav nnav" aria-label="Topics">${tps.map(x=>`<a href="${base}/${x}" ${x===t?'aria-current="page"':''} aria-label="Topic ${x}">${x}</a>`).join('')}<a href="${base}">All topics</a></nav>
  <div class="ahead"><div class="kick">Topic ${t}</div><h2>${esc(TERM.topics[t])}</h2></div>
  <div class="jump" aria-label="On this page">${jumps.map(([id,n])=>`<button type="button" class="opt" data-jump="${id}">${esc(n)}</button>`).join('')}</div>
  <div class="lo" id="n-min"><h3>In one minute</h3>${listHTML(T.min)}<h3>What you need to be able to do</h3><p>${esc(T.lo)}</p><h3>What the exam asks</h3>${listHTML(T.exam)}</div>
  <h3 class="h2s" id="n-ideas">Key ideas</h3>
  <p class="intro">Read one card at a time. Look at each diagram and try to say it in your own words.</p>
  ${T.ideas.map(ideaHTML).join('')}
  <h3 class="h2s" id="n-terms">Key terms</h3>
  <p class="intro">Tap a card to see the meaning. Say the meaning out loud before you tap.</p>
  <div class="terms">${T.terms.map(([a],k)=>`<button type="button" class="term" aria-pressed="false" data-ti="${k}"><b>${esc(a)}</b><span>Tap to reveal</span></button>`).join('')}</div>
  <div class="row"><button type="button" class="btn" data-tall="1">Show all</button><button type="button" class="btn" data-tall="0">Hide all</button></div>
  ${T.mistakes?`<div class="part mis" id="n-mis"><h3>Common mistakes</h3>${listHTML(T.mistakes)}</div>`:''}
  ${W?`<div class="part" id="n-ans"><h3>Answer like this</h3><p class="intro">A worked practice question. Plan your own answer first, then open the model.</p>
   <div class="qbox"><div class="ql">Practice question · ${W.marks||5} marks</div><p>${esc(W.q)}</p></div>
   <div class="paper guide"><h3>✍ Plan</h3><ol>${W.plan.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div>
   <details class="think model"><summary>Model answer, with what each part does</summary>${W.model.map(([tag,x])=>`<p><span class="chip">${esc(tag)}</span> ${esc(x)}</p>`).join('')}</details></div>`:''}
  <h3 class="h2s" id="n-chk">Check yourself</h3>
  <p class="intro">Answer in your head or on paper first. Then open the answer.</p>
  ${T.check.map(([q,a],k)=>`<details class="think model chk"><summary>${k+1}. ${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}
  <div class="part" id="n-prac"><h3>Practise this topic</h3><p class="intro" style="margin:0">Try 10 multiple choice questions on Topic ${t} only. You see right or wrong at once, with a reason.</p>
   <div class="row"><a class="btn primary" href="${base}/${t}/practice">Practise Topic ${t} →</a><a class="btn" href="#/paper/${P.id}/b">Section B short answers</a></div></div>
  <div class="part explore" id="n-ai"><h3>Explore further with AI</h3><p class="intro">Copy a prompt, open Gemini, and paste it in. Read the reply with care. Check every idea against these notes and your textbook.</p>
   ${T.prompts.map((x,k)=>`<div class="prompt"><p>${esc(x)}</p><button class="btn" type="button" data-copy="${k}">Copy prompt</button></div>`).join('')}
   <div class="row"><a class="btn primary" href="${GEMINI}" target="_blank" rel="noopener">Open Gemini ↗</a></div></div>
  <div class="anext">${prev?`<a class="btn" href="${base}/${prev}" style="text-decoration:none;color:var(--ink)">← Topic ${prev}</a>`:'<span></span>'}${next?`<a class="btn primary" href="${base}/${next}" style="text-decoration:none">Topic ${next} →</a>`:`<a class="btn primary" href="#/paper/${P.id}/a" style="text-decoration:none">Try a full Section A →</a>`}</div>
  ${paperFoot(P,'notes')}${footHTML()}`;
 const flip=(b,on)=>{b.setAttribute('aria-pressed',on);b.querySelector('span').textContent=on?T.terms[b.dataset.ti][1]:'Tap to reveal'};
 el.onclick=e=>{const j=e.target.closest('[data-jump]');if(j){const x=document.getElementById(j.dataset.jump);if(x)x.scrollIntoView({behavior:'smooth'});return}
  const tm=e.target.closest('[data-ti]');if(tm){flip(tm,tm.getAttribute('aria-pressed')!=='true');return}
  const ta=e.target.closest('[data-tall]');if(ta){$$('[data-ti]',el).forEach(b=>flip(b,ta.dataset.tall==='1'));return}
  const b=e.target.closest('[data-copy]');if(!b)return;const txt=T.prompts[+b.dataset.copy];
  const ok=()=>{b.textContent='Copied ✓';setTimeout(()=>{b.textContent='Copy prompt'},2000)};
  const old=()=>{const a=document.createElement('textarea');a.value=txt;a.setAttribute('readonly','');a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();
   try{document.execCommand('copy');ok()}catch(err){b.textContent='Select and copy the text'}a.remove()};
  if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(txt).then(ok,old);else old();};
}

/* Topic practice from the notes: 10 released MCQs from one topic, kept apart from the Section A set */
function renderDrill(P,t,el){
 const k='drill_'+P.id+'_'+t,n=10,byId=Object.fromEntries(BANK.mcq.map(q=>[q.id,q]));document.title='Topic '+t+' practice · MKT101 Practice';
 const fresh=()=>{const ids=shuffle(BANK.mcq.filter(q=>q.t===t&&q.p.includes(P.id)&&released(q))).slice(0,n).map(q=>q.id);
  const s={ids,ord:Object.fromEntries(ids.map(id=>[id,shuffle([0,1,2,3])])),ans:{}};S.set(k,s);return s};
 let set=S.get(k,null);if(!set||!set.ids.every(id=>byId[id]&&released(byId[id])))set=fresh();
 const draw=()=>{const a=Object.keys(set.ans).length,sc=set.ids.filter(id=>set.ans[id]===0).length,all=a===set.ids.length;
  el.innerHTML=`<div class="incase"><a href="#/paper/${P.id}/notes/${t}">← Topic ${t} notes</a><span>·</span><b>${esc(topicName(t))}</b></div>
  ${all?`<div class="res" id="res"><div class="kick">Your result</div><div class="big">${sc} / ${set.ids.length}</div><p class="intro" style="margin:6px 0 0">${sc/set.ids.length>=.7?'Well done. Try a new set, or move on to the next topic.':'Read the notes for this topic again, then try a new set.'}</p></div>`:''}
  ${set.ids.map((id,i)=>mcqHTML(byId[id],set,i)).join('')}
  <div class="tot"><span>Answered <b>${a} / ${set.ids.length}</b> · Score <b>${sc}</b></span><button class="btn" data-a="new">New set</button></div>
  ${paperFoot(P,'notes')}`;};
 draw();
 el.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.oi!==undefined){const id=b.closest('.mcq').dataset.id;set.ans[id]=+b.dataset.oi;S.set(k,set);
   const y=scrollY;draw();scrollTo(0,y);if(Object.keys(set.ans).length===set.ids.length)$('#res').scrollIntoView({behavior:'smooth'});}
  else if(b.dataset.a==='new'){set=fresh();draw();scrollTo(0,0);}};
}

/* ---------- router ---------- */
function route(){
 const h=location.hash.replace(/^#\/?/,'').split('/');const cid=h[0];
 clearInterval(tmr);
 if(!me()){
  if(cid==='verify')renderVerify();
  else{if(cid){try{sessionStorage.setItem('mkt101-next',location.hash)}catch(e){}history.replaceState(null,'','#/')}renderLanding();}
  window.scrollTo(0,0);return;
 }
 if(cid==='verify'){location.replace('#/');return}
 if(cid==='paper')renderPaper(h[1]||'final',h[2],h[3],h[4]);
 else if(!CASES[cid]){renderHome();}else{const tab=['read','terms','act','exam','tips'].includes(h[1])?h[1]:'read';renderCase(cid,tab,parseInt(h[2],10)||1);}
 window.scrollTo(0,0);
}
addEventListener('hashchange',route);route();
